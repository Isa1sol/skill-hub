<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}SkillHub{% endblock %}</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #fef9f4;
            color: #2e2e2e;
            margin: 0;
        }
        .navbar {
            background: #222;
            padding: 1rem;
            color: white;
            display: flex;
            justify-content: space-between;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 1rem;
        }
        .dashboard-container {
            padding: 2rem;
            background: #fff;
            margin: 2rem auto;
            width: 80%;
            border: 2px dashed #ccc;
        }
        .card {
            background: #f4f4f4;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
        }
        .card ul {
            list-style-type: none;
            padding: 0;
        }
        .card li {
            padding: 0.5rem 0;
            border-bottom: 1px solid #ddd;
        }
        .card li a {
            text-decoration: none;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div><a href="{{ url_for('main.home') }}">🏠 Home</a></div>
        <div>
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('main.dashboard') }}">📊 Dashboard</a>
                <a href="{{ url_for('main.logout') }}">🚪 Logout</a>
            {% else %}
                <a href="{{ url_for('main.login') }}">🔐 Login</a>
                <a href="{{ url_for('main.register') }}">📝 Register</a>
            {% endif %}
        </div>
    </div>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="card">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</body>
</html>
