<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Skill Hub - Course Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 { text-align: center; }
    label { display: block; margin-top: 10px; }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container" id="registrationPage">
    <h2>Register for Skill Hub</h2>
    <label for="role">Choose your role:</label>
    <select id="role">
      <option value="student">Student</option>
      <option value="instructor">Instructor</option>
    </select>
    <label for="username">Choose a username:</label>
    <input type="text" id="username" placeholder="Username" />
    <label for="email">Enter your email (.com only):</label>
    <input type="email" id="email" placeholder="you@example.com" />
    <button onclick="registerUser()">Register</button>
  </div>

  <div class="container hidden" id="dashboardPage">
    <h2>Welcome to Skill Hub</h2>
    <p id="welcomeUser"></p>
    <button onclick="logoutUser()">Log Out</button>

    <div id="instructorControls" class="hidden">
      <h3>Create New Course</h3>
      <input type="text" id="newCourseName" placeholder="New Course Name" />
      <input type="url" id="newCourseLink" placeholder="Course Wiki Link" />
      <button onclick="createCourse()">Add Course</button>
    </div>

    <h3>Available Courses</h3>
    <ul id="courseList"></ul>

    <h3>Add Notes</h3>
    <textarea id="noteInput" placeholder="Write your notes here..."></textarea><br />
    <label for="colorPicker">Text Color:</label>
    <input type="color" id="colorPicker" value="#000000">
    <button onclick="saveNote()">Save Note</button>
    <ul id="savedNotes"></ul>

    <h3>Set Deadlines</h3>
    <input type="text" id="assignmentTitle" placeholder="Assignment Title" />
    <input type="date" id="deadlineDate" />
    <button onclick="addDeadline()">Add Deadline</button>
    <ul id="deadlines"></ul>

    <!-- AI Integration Removed -->
    <!-- <h3>Ask AI</h3>
    <input type="text" id="aiQuestion" placeholder="Ask anything..." />
    <button onclick="askAI()">Ask</button>
    <p id="aiResponse"></p> -->
  </div>

  <script>
    let currentUserRole = "";
    let courses = [
      { name: "Intro to Web Dev", link: "https://en.wikipedia.org/wiki/Web_development" },
      { name: "Java Programming", link: "https://en.wikipedia.org/wiki/Java_(programming_language)" },
      { name: "Data Structures", link: "https://en.wikipedia.org/wiki/Data_structure" },
      { name: "AI Fundamentals", link: "https://en.wikipedia.org/wiki/Artificial_intelligence" }
    ];

    function registerUser() {
      const role = document.getElementById("role").value;
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();

      if (!username) return alert("Please enter a username.");
      if (!email.endsWith(".com")) return alert("Please enter a valid email ending in .com.");

      currentUserRole = role;

      document.getElementById("registrationPage").classList.add("hidden");
      document.getElementById("dashboardPage").classList.remove("hidden");
      document.getElementById("welcomeUser").innerText = `Hello, ${username} (${role})!`;

      if (role === "instructor") {
        document.getElementById("instructorControls").classList.remove("hidden");
      } else {
        document.getElementById("instructorControls").classList.add("hidden");
      }

      renderCourses();
    }

    function logoutUser() {
      document.getElementById("dashboardPage").classList.add("hidden");
      document.getElementById("registrationPage").classList.remove("hidden");
      document.getElementById("username").value = "";
      document.getElementById("email").value = "";
    }

    function renderCourses() {
      const courseList = document.getElementById("courseList");
      courseList.innerHTML = "";

      courses.forEach(course => {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.textContent = course.name;
        btn.onclick = () => window.open(course.link, "_blank");
        li.appendChild(btn);
        courseList.appendChild(li);
      });
    }

    function createCourse() {
      const name = document.getElementById("newCourseName").value.trim();
      const link = document.getElementById("newCourseLink").value.trim();
      if (!name || !link) return alert("Please fill in both fields.");
      courses.push({ name, link });
      document.getElementById("newCourseName").value = "";
      document.getElementById("newCourseLink").value = "";
      renderCourses();
    }

    function saveNote() {
      const note = document.getElementById("noteInput").value.trim();
      const selectedColor = document.getElementById("colorPicker").value;
      if (note) {
        const listItem = document.createElement("li");
        listItem.textContent = note;
        listItem.style.color = selectedColor;
        document.getElementById("savedNotes").appendChild(listItem);
        document.getElementById("noteInput").value = "";
      }
    }

    function addDeadline() {
      const title = document.getElementById("assignmentTitle").value;
      const date = document.getElementById("deadlineDate").value;
      if (title && date) {
        const li = document.createElement("li");
        li.innerText = `${title} - Due: ${date}`;
        document.getElementById("deadlines").appendChild(li);
        document.getElementById("assignmentTitle").value = "";
        document.getElementById("deadlineDate").value = "";
      }
    }
